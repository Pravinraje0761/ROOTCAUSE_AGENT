version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: rootcause-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rootcause_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: rootcause-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rootcause_db
      - PORT=8000
      - HOST=0.0.0.0
      - USE_DOCKER_SANDBOX=false
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
