name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Agent tests and baseline sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the application the agent investigates
        uses: actions/checkout@v4
        with:
          repository: Pravinraje0761/neogaurd
          path: WE_WILL_WIN/neoguard_app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Baseline sweep (simulated scenarios)
        run: python evaluation/run_sweep.py | tail -12

  frontend:
    name: Dashboard type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
